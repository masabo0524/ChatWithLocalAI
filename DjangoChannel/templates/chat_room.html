{% for room in rooms %}
<h2>
  <a href="{% url "channel:room" room.id %}">
    {{room.room_name}}
  </a>
</h2>
<ul>
  {% for member in room.member.all %}
  <li>
    <p>{{member.member}}</p>
  </li>
{% endfor %}
</ul>
{% endfor %}

<h2>
  <a href="{% url 'channel:add_room' %}">+Create New Room</a>
</h2>
